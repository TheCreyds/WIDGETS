```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;padding:8px;background:transparent;font-family:Arial,sans-serif;color:#fff}
.player{width:100%;max-width:340px;margin:auto;padding:15px 17px;background:#121212;border:1px solid #292929;border-radius:16px;box-shadow:0 8px 24px #0005}
.info{display:flex;align-items:center;gap:12px}
.cover{width:54px;height:54px;flex-shrink:0;border-radius:10px;background:linear-gradient(145deg,#292929,#111);display:flex;align-items:center;justify-content:center;color:#e37b58;font-size:24px}
.details{min-width:0;flex:1}
.label{font-size:9px;letter-spacing:1.8px;color:#888;text-transform:uppercase;margin-bottom:5px}
.title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subtitle{font-size:10px;color:#888;margin-top:4px}
.controls{display:flex;justify-content:center;align-items:center;gap:23px;margin:15px 0 13px}
button{cursor:pointer;border:0}
.skip{background:transparent;color:#bbb;font-size:19px;padding:4px}
.play{width:39px;height:39px;border-radius:50%;background:#fff;color:#111;font-size:16px;display:flex;align-items:center;justify-content:center}
.timeline{display:flex;align-items:center;gap:8px}
.time{font-size:9px;color:#888;min-width:27px}
input[type=range]{appearance:none;-webkit-appearance:none;flex:1;min-width:0;height:3px;background:#444;border-radius:5px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;background:#e37b58;border-radius:50%}
input[type=range]::-moz-range-thumb{width:9px;height:9px;background:#e37b58;border:0;border-radius:50%}
</style>
</head>
<body>
<div class="player">
  <div class="info">
    <div class="cover">♫</div>
    <div class="details">
      <div class="label">NOW PLAYING</div>
      <div class="title" id="track-title">Canción 1</div>
      <div class="subtitle">Creyds Playlist · <span id="track-number">01</span> / 05</div>
    </div>
  </div>
  <div class="controls">
    <button class="skip" id="prev" aria-label="Anterior">⏮</button>
    <button class="play" id="play" aria-label="Reproducir">▶</button>
    <button class="skip" id="next" aria-label="Siguiente">⏭</button>
  </div>
  <div class="timeline">
    <span class="time" id="current">0:00</span>
    <input type="range" id="progress" min="0" max="1000" value="0" aria-label="Progreso">
    <span class="time" id="duration">0:00</span>
  </div>
  <audio id="audio" preload="metadata"></audio>
</div>
<script>
(function(){
const tracks=[
{name:"Canción 1",url:"https://cdn.jsdelivr.net/gh/TheCreyds/Creyds@main/cancion1.mp3"},
{name:"Canción 2",url:"https://cdn.jsdelivr.net/gh/TheCreyds/Creyds@main/cancion2.mp3"},
{name:"Canción 3",url:"https://cdn.jsdelivr.net/gh/TheCreyds/Creyds@main/cancion3.mp3"},
{name:"Canción 4",url:"https://cdn.jsdelivr.net/gh/TheCreyds/Creyds@main/cancion4.mp3"},
{name:"Canción 5",url:"https://cdn.jsdelivr.net/gh/TheCreyds/Creyds@main/cancion5.mp3"}
];
const audio=document.getElementById("audio");
const title=document.getElementById("track-title");
const number=document.getElementById("track-number");
const play=document.getElementById("play");
const progress=document.getElementById("progress");
const current=document.getElementById("current");
const duration=document.getElementById("duration");
let index=0;
let seeking=false;

function formatTime(s){
if(!Number.isFinite(s)||s<0)return "0:00";
return Math.floor(s/60)+":"+(Math.floor(s%60)<10?"0":"")+Math.floor(s%60);
}
function loadTrack(i,autoplay){
index=(i+tracks.length)%tracks.length;
title.textContent=tracks[index].name;
number.textContent=String(index+1).padStart(2,"0");
audio.src=tracks[index].url;
progress.value=0;
current.textContent="0:00";
duration.textContent="0:00";
audio.load();
if(autoplay){
const p=audio.play();
if(p)p.catch(()=>{play.textContent="▶";});
}
}
play.addEventListener("click",()=>{
if(audio.paused){
const p=audio.play();
if(p)p.catch(()=>{play.textContent="▶";});
}else audio.pause();
});
document.getElementById("prev").addEventListener("click",()=>{
if(audio.currentTime>3){audio.currentTime=0;}
else loadTrack(index-1,true);
});
document.getElementById("next").addEventListener("click",()=>loadTrack(index+1,true));
audio.addEventListener("play",()=>play.textContent="Ⅱ");
audio.addEventListener("pause",()=>play.textContent="▶");
audio.addEventListener("loadedmetadata",()=>duration.textContent=formatTime(audio.duration));
audio.addEventListener("timeupdate",()=>{
if(!seeking&&Number.isFinite(audio.duration)&&audio.duration>0){
progress.value=audio.currentTime/audio.duration*1000;
}
current.textContent=formatTime(audio.currentTime);
});
progress.addEventListener("input",()=>{
seeking=true;
if(Number.isFinite(audio.duration)&&audio.duration>0){
current.textContent=formatTime(Number(progress.value)/1000*audio.duration);
}
});
progress.addEventListener("change",()=>{
if(Number.isFinite(audio.duration)&&audio.duration>0){
audio.currentTime=Number(progress.value)/1000*audio.duration;
}
seeking=false;
});
audio.addEventListener("ended",()=>loadTrack(index+1,true));
audio.addEventListener("error",()=>title.textContent="No se pudo cargar la canción");
loadTrack(0,false);
})();
</script>
</body>
</html>
