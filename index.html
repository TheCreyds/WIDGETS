
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creyds Music Player</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif;color:#f5f5f5}
.player{width:100%;max-width:340px;margin:0 auto;padding:16px;background:#111;border:1px solid #292929;border-radius:16px}
.top{display:flex;align-items:center;gap:12px}
.note{width:54px;height:54px;flex-shrink:0;display:grid;place-items:center;background:linear-gradient(145deg,#252525,#171717);border-radius:12px;color:#e9815d;font-size:25px}
.info{min-width:0;flex:1}
.label{font-size:9px;letter-spacing:2px;color:#888;margin-bottom:5px}
.name{font-size:12px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:9px;color:#999;margin-top:5px}
.controls{display:flex;align-items:center;justify-content:center;gap:24px;margin:13px 0 9px}
button{border:0;cursor:pointer;color:#bbb;background:transparent;font-size:18px;padding:2px}
button:hover{color:#fff}
button.play{background:#fff;color:#111;width:39px;height:39px;border-radius:50%;font-size:18px;display:grid;place-items:center}
.progress{display:flex;align-items:center;gap:8px;color:#888;font-size:9px}
input[type=range]{flex:1;min-width:0;height:4px;accent-color:#e9815d;cursor:pointer}
</style>
</head>
<body>
<div class="player">
  <div class="top">
    <div class="note">♫</div>
    <div class="info">
      <div class="label">NOW PLAYING</div>
      <div class="name" id="songName">Selecciona una canción</div>
      <div class="sub" id="songCount">NOIR · 00 / 05</div>
    </div>
  </div>
  <div class="controls">
    <button id="prev" aria-label="Canción anterior">⏮</button>
    <button class="play" id="toggle" aria-label="Reproducir">▶</button>
    <button id="next" aria-label="Siguiente canción">⏭</button>
  </div>
  <div class="progress">
    <span id="elapsed">0:00</span>
    <input id="seek" type="range" min="0" max="100" value="0" aria-label="Progreso">
    <span id="duration">0:00</span>
  </div>
  <audio id="audio" preload="metadata"></audio>
</div>

<script>
/* ==================================================
   EDITA AQUÍ TU LISTA DE CANCIONES
   Pon el nombre y el enlace directo de cada archivo.
   Puedes agregar o quitar canciones cuando quieras.
   ================================================== */

const songs = [
  {
    title: "Ash",
    url: "https://raw.githubusercontent.com/TheCreyds/WIDGETS/main/Ash.mp3"
  },
  {
    title: "Blue",
    url: "https://raw.githubusercontent.com/TheCreyds/WIDGETS/main/Blue%20FINAL.mp3"
  },
  {
    title: "Drunk On The Moment",
    url: "https://raw.githubusercontent.com/TheCreyds/WIDGETS/main/Drunk%20On%20The%20Moment.mp3"
  },
  {
    title: "In The Distance",
    url: "https://raw.githubusercontent.com/TheCreyds/WIDGETS/main/In%20the%20distance.mp3"
  },
  {
    title: "Never Let Me Go",
    url: "https://raw.githubusercontent.com/TheCreyds/WIDGETS/main/Never%20Let%20me%20Go%20%28GOSPEL%29.mp3"
  }
];

/* No necesitas modificar el código que sigue. */
const audio = document.getElementById("audio");
const songName = document.getElementById("songName");
const songCount = document.getElementById("songCount");
const toggle = document.getElementById("toggle");
const seek = document.getElementById("seek");
const elapsed = document.getElementById("elapsed");
const duration = document.getElementById("duration");

let current = 0;

function validSongs() {
  return songs.filter(s => s.url && !s.url.startsWith("PEGA_AQUI"));
}

function time(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

function loadSong(index, autoplay = false) {
  const list = validSongs();
  if (!list.length) {
    songName.textContent = "Añade los enlaces de las canciones";
    songCount.textContent = "NOIR · 00 / 00";
    return;
  }

  current = (index + list.length) % list.length;
  const song = list[current];

  audio.pause();
  audio.src = song.url;
  audio.load();

  songName.textContent = song.title;
  songCount.textContent =
    `NOIR · ${String(current + 1).padStart(2, "0")} / ${String(list.length).padStart(2, "0")}`;
  toggle.textContent = "▶";
  seek.value = 0;
  elapsed.textContent = "0:00";
  duration.textContent = "0:00";

  if (autoplay) {
    audio.play().then(() => {
      toggle.textContent = "Ⅱ";
    }).catch(() => {
      songName.textContent = "No se pudo cargar la canción";
      toggle.textContent = "▶";
    });
  }
}

toggle.addEventListener("click", () => {
  if (!validSongs().length) {
    songName.textContent = "Añade los enlaces en el HTML";
    return;
  }

  if (audio.paused) {
    if (!audio.src) {
      loadSong(current, true);
    } else {
      audio.play().then(() => {
        toggle.textContent = "II";
      }).catch(() => {
        songName.textContent = "No se pudo cargar la canción";
      });
    }
  } else {
    audio.pause();
    toggle.textContent = "▶";
  }
});

document.getElementById("prev").addEventListener("click", () => {
  loadSong(current - 1, true);
});

document.getElementById("next").addEventListener("click", () => {
  loadSong(current + 1, true);
});

audio.addEventListener("ended", () => {
  loadSong(current + 1, true);
});

audio.addEventListener("loadedmetadata", () => {
  duration.textContent = time(audio.duration);
});

audio.addEventListener("timeupdate", () => {
  elapsed.textContent = time(audio.currentTime);
  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    seek.value = (audio.currentTime / audio.duration) * 100;
  }
});

seek.addEventListener("input", () => {
  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    audio.currentTime = (Number(seek.value) / 100) * audio.duration;
  }
});

loadSong(0);
</script>
</body>
</html>
